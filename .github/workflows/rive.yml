# Construit les animations Rive (dossier rive/) avec la Rive CLI, puis publie
# le .riv, une capture et la documentation utile sur la branche `journal-rive`.
name: Rive
on:
  push:
    branches: [rive-splash]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer la Rive CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libgl1 libgl1-mesa-dri xvfb libvulkan1 mesa-vulkan-drivers ffmpeg > /dev/null
          mkdir -p /tmp/sortie
          curl -fsSL https://releases.rive.app/cli/install.sh -o /tmp/sortie/install.sh
          # la 1.9 exige un compte pour écrire le .riv : on garde la 1.8 si possible
          (RIVE_VERSION=1.8.0 sh /tmp/sortie/install.sh 1.8.0 || sh /tmp/sortie/install.sh) > /tmp/sortie/installation.txt 2>&1
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
      - name: Documentation et construction
        run: |
          set +e
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p /tmp/sortie/docs
          rive --version > /tmp/sortie/version.txt 2>&1
          rive --help > /tmp/sortie/aide.txt 2>&1
          rive doctor >> /tmp/sortie/version.txt 2>&1
          rive docs --list > /tmp/sortie/docs/liste.txt 2>&1
          for t in $(rive docs --list 2>/dev/null | awk '{print $1}' | grep -E '^[a-z][a-z0-9_/-]*$' | head -60); do
            rive docs "$t" > "/tmp/sortie/docs/$(echo $t | tr '/' '_').md" 2>&1
          done
          for ty in Artboard Shape Path PointsPath StraightVertex CubicDetachedVertex CubicMirroredVertex Ellipse Rectangle Fill Stroke SolidColor LinearGradient RadialGradient GradientStop Node LinearAnimation KeyedObject KeyedProperty KeyFrameDouble KeyFrameColor CubicEaseInterpolator StateMachine StateMachineLayer AnimationState EntryState StateTransition; do
            rive schema "$ty" > "/tmp/sortie/docs/schema_$ty.txt" 2>&1
          done
          cp -r "$(rive samples --path 2>/dev/null)" /tmp/sortie/exemple 2>/dev/null
          python3 rive/outils/generer_mascotte.py --apercus > /tmp/sortie/generation.txt 2>&1
          python3 rive/outils/generer_effets.py --apercus >> /tmp/sortie/generation.txt 2>&1
          rive schema TrimPath > /tmp/sortie/docs/schema_TrimPath.txt 2>&1
          rive schema StateMachineNumber > /tmp/sortie/docs/schema_StateMachineNumber.txt 2>&1
          for p in rive/kunfox_* rive/apercus/*; do
            n=$(basename $p); mkdir -p /tmp/sortie/$n
            rive inspect $p --summary > /tmp/sortie/$n/inspection.txt 2>&1
            rive $p --verify > /tmp/sortie/$n/verification.txt 2>&1; echo "verif: $?" >> /tmp/sortie/$n/verification.txt
            # la CLI récente remplace --once par --publish (qui écrit le .riv)
            rive $p --once > /tmp/sortie/$n/construction.txt 2>&1; echo "construction: $?" >> /tmp/sortie/$n/construction.txt
            find $p -name '*.riv' -newer $p/scene.rml -exec cp {} /tmp/sortie/$n/ \; 2>/dev/null
            find . -maxdepth 2 -name '*.riv' -newer $p/scene.rml -exec cp {} /tmp/sortie/$n/ \; 2>/dev/null
            ls -la $p >> /tmp/sortie/$n/construction.txt
            case $n in kunfox_*) continue;; esac
            for ms in 0 120 250 400 550 700 900 1200 1600 2100 2600 3200; do
              rive $p --screenshot=/tmp/sortie/$n/c_$(printf %05d $ms).png --advance=${ms}ms >> /tmp/sortie/$n/captures.txt 2>&1
            done
          done
          # vidéos : une image toutes les 33 ms, assemblées en MP4 (30 i/s)
          for n in mascotte_joie mascotte_courage mascotte_fete mascotte_attente; do
            d=rive/apercus/$n; [ -d $d ] || continue
            mkdir -p /tmp/images/$n
            for i in $(seq 0 89); do
              rive $d --screenshot=/tmp/images/$n/v_$(printf %03d $i).png --advance=$((i * 33))ms >/dev/null 2>&1
            done
            ffmpeg -loglevel error -y -framerate 30 -i /tmp/images/$n/v_%03d.png -vf "scale=480:-2" -pix_fmt yuv420p -movflags +faststart /tmp/sortie/$n/$n.mp4
          done
          grep -H "" /tmp/sortie/*/verification.txt /tmp/sortie/*/construction.txt > /tmp/sortie/bilan.txt
          true
      - name: Publier
        if: always()
        run: |
          cd /tmp/sortie && git init -q -b journal-rive
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "journal $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" journal-rive
