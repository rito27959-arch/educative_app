# Vérification d'Ouro Prep : analyse, tests, construction, puis captures
# d'écran sur un émulateur Android. Résultats publiés sur `journal-ouro`.
name: Vérifier Ouro Prep
on:
  push:
    branches: [verif-ouro, kunfox]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyse, tests, construction
        run: |
          set +e
          mkdir -p resultats
          flutter --version > resultats/journal.txt 2>&1
          flutter pub get >> resultats/journal.txt 2>&1
          echo "== analyse" >> resultats/journal.txt
          flutter analyze lib > resultats/analyse.txt 2>&1
          echo "analyse: $?" >> resultats/journal.txt
          grep -c " error •" resultats/analyse.txt | sed 's/^/erreurs: /' >> resultats/journal.txt
          grep -c " warning •" resultats/analyse.txt | sed 's/^/avertissements: /' >> resultats/journal.txt
          grep -c " info •" resultats/analyse.txt | sed 's/^/infos: /' >> resultats/journal.txt
          echo "== tests" >> resultats/journal.txt
          flutter test test > resultats/tests.txt 2>&1
          echo "tests: $?" >> resultats/journal.txt
          tail -3 resultats/tests.txt >> resultats/journal.txt
          echo "== construction" >> resultats/journal.txt
          flutter build apk --debug > resultats/construction.txt 2>&1
          echo "construction: $?" >> resultats/journal.txt
          tail -30 resultats/construction.txt >> resultats/journal.txt
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Captures sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p resultats/captures ; (adb logcat -m 1 -e "KUNFOX-AUTORISER" >/dev/null ; adb shell pm grant app.dropletmesh.kunfox android.permission.POST_NOTIFICATIONS ; adb logcat -m 1 -e "Rappels\] essai" >/dev/null ; sleep 3 ; adb shell cmd statusbar expand-notifications ; sleep 3 ; adb exec-out screencap -p > resultats/captures/50_notifications.png ; adb shell cmd statusbar collapse) & flutter drive --driver=test_driver/integration_test.dart --target=integration_test/captures_test.dart > resultats/drive.txt 2>&1 ; echo "drive=$?" >> resultats/journal.txt
            sleep 5 ; test -s resultats/captures/50_notifications.png || echo "aucune notification Kunfox vue" >> resultats/journal.txt
      - name: Publier
        if: always()
        run: |
          # Un dépôt à part, qui ne contient QUE les résultats : publier depuis
          # le dossier du projet embarquait build/ (l'APK, des centaines de Mo)
          # et le dépôt refusait l'envoi.
          mkdir -p resultats; cp -r captures resultats/ 2>/dev/null || true
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r resultats/* /tmp/pub/
          cd /tmp/pub
          git init -q -b journal-ouro
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A; git commit -qm "journal $GITHUB_SHA"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" journal-ouro
