name: ouro_prep
description: OURO PREP — Premium African education platform with Mesh P2P.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.12.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  # « Se connecter avec Droplet » : échange chiffré et sauvegarde.
  cryptography: ^2.7.0
  url_launcher: ^6.3.1
  file_picker: ^8.0.0
  universal_ble: ^0.10.0
  nsd: ^5.0.1
  nearby_service: ^0.2.1
  flutter_webrtc: ^1.5.2
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.4
  sentry_flutter: ^9.24.0
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  sentry: ^9.24.0
  record: ^6.2.1
  audioplayers: ^6.4.0
  llamadart: ^0.8.14
  llamadart_llama_cpp_flutter: ^0.0.9
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  # L'écran d'ouverture animé (fichier construit avec la Rive CLI).
  rive: ^0.13.20
  # Effets de jeu (ciel du parcours, confettis, étincelles).
  flame: ^1.18.0
  # La barre d'onglets de Droplet : verre liquide et ressorts d'Apple.
  liquid_glass_renderer: ^0.2.0-dev.4
  motor: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/course_content.json
    - assets/rive/
    - assets/sons/
  shaders:
    - shaders/lentille_ios.frag
  # Inter et Inter Tight, les polices du site (licence OFL, assets/fonts/OFL-Inter.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-600.ttf
          weight: 600
        - asset: assets/fonts/InterTight-700.ttf
          weight: 700
        - asset: assets/fonts/InterTight-800.ttf
          weight: 800
